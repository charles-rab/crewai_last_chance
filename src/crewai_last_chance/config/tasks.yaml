tasks:
  - id: inventory_analysis
    description: "Analyze current inventory levels, identify products at risk of stockout, and recommend restocking quantities"
    expected_output: "A detailed inventory report with actionable recommendations"
    agent: inventory_manager
    async: false
    
  - id: marketing_performance_analysis
    description: "Analyze marketing channel performance, identify opportunities, and recommend marketing strategies"
    expected_output: "A marketing performance report with channel analysis and strategy recommendations"
    agent: marketing_analyst
    async: false
    
  - id: product_research
    description: "Research market trends and identify potential new products that align with the store's current offerings"
    expected_output: "A list of potential new products with market analysis and profit projections"
    agent: product_researcher
    async: false
    
  - id: customer_feedback_analysis
    description: "Analyze customer feedback, identify common issues, and prepare response templates"
    expected_output: "A report of common customer issues with prepared response templates"
    agent: customer_service_assistant
    async: false
    
  - id: store_optimization
    description: "Analyze the store's performance, layout, and user experience, and recommend improvements"
    expected_output: "A store optimization report with actionable recommendations"
    agent: store_optimizer
    async: false
    context: "{inventory_analysis}, {marketing_performance_analysis}, {product_research}, {customer_feedback_analysis}"
